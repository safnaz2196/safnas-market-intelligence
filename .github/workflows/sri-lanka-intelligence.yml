name: Safnas Finance — v5 Autonomous CSE Research
on:
  push:
    branches: [main]
    paths:
      - 'collector/research-v5-publish.cjs'
      - 'collector/company-endpoint-probe.cjs'
      - 'collector/research-v5-publish.test.cjs'
      - '.github/workflows/sri-lanka-intelligence.yml'
  schedule:
    # Three best-effort checks per weekday in Sri Lanka local time.
    - cron: '37 2,7,12 * * 1-5'
    # Weekend data quality and research freshness check.
    - cron: '37 4 * * 0,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sri-lanka-public-data-intelligence
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate collectors and learner
        run: node --test collector/*.test.cjs
      - name: Probe CSE company data endpoints
        run: node collector/company-endpoint-probe.cjs
      - name: Collect public market observations (existing v4 archive preserved)
        run: node collector/update.cjs
      - name: Publish source-grounded autonomous v5 research
        run: node collector/research-v5-publish.cjs
      - name: Publish research audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-intelligence/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh autonomous v5 CSE research and model audits"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
