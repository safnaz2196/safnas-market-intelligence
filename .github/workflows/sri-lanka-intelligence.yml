name: Safnas Finance — CSE Market and Economy Archive
on:
  push:
    branches: [main]
    paths:
      - 'collector/update.cjs'
      - 'collector/research-v5-publish.cjs'
      - 'collector/research-v5-publish.test.cjs'
      - 'collector/turnover-source.test.cjs'
      - 'collector/share-quotes.test.cjs'
      - '.github/workflows/sri-lanka-intelligence.yml'
  schedule:
    # Three best-effort checks per weekday in Sri Lanka local time.
    - cron: '37 2,7,12 * * 1-5'
    # Weekend data quality and research freshness check.
    - cron: '37 4 * * 0,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sri-lanka-public-data-intelligence
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate collectors and learner
        run: node --test collector/*.test.cjs
      - name: Collect public market observations (existing v4 archive preserved)
        run: node collector/update.cjs
      - name: Synchronize AutoPilot v5 research with the newest CSE source health
        run: node collector/research-v5-publish.cjs
      - name: Publish research audit with safe retry during concurrent research updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              node collector/update.cjs
              node collector/research-v5-publish.cjs
            fi
            git add market-intelligence/
            if git diff --staged --quiet; then
              echo "Collector data and research are already up to date."
              exit 0
            fi
            git commit -m "Refresh CSE market archive and consistent AutoPilot research"
            if git push origin HEAD:main; then
              echo "Market + AutoPilot data published from the same collector snapshot."
              exit 0
            fi
            echo "Main changed while publishing; refresh and retry $attempt"
          done
          echo "Unable to publish without overwriting concurrent changes" >&2
          exit 1
