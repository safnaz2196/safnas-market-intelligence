name: Sri Lanka market intelligence — v3.6 reliable research
on:
  schedule:
    # Weekdays 08:00 and 18:00 Sri Lanka time (UTC +05:30)
    - cron: '30 2 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sri-lanka-public-data-intelligence
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate collectors and learner
        run: node --test collector/*.test.cjs
      - name: Collect public data and retrain if eligible
        run: node collector/update.cjs
      - name: Publish research audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-intelligence/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh Sri Lanka market and prediction audits"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
