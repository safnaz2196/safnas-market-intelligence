name: Safnas Finance — Verified CSE Companies (Free AutoPilot)
on:
  push:
    branches: [main]
    paths:
      - 'collector/company-evidence-v5.cjs'
      - 'collector/company-evidence-v5.test.cjs'
      - 'collector/research-v5-publish.cjs'
      - '.github/workflows/company-research-v53.yml'
  schedule:
    # Best-effort during trading weekdays, in UTC. CSE data are last-traded, not streaming.
    - cron: '25 3,5,7,10 * * 1-5'
    - cron: '25 4 * * 0,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: safnas-independent-cse-company-research
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate company evidence and report contracts
        run: node --test collector/company-evidence-v5.test.cjs collector/research-v5-publish.test.cjs
      - name: Refresh 16 CSE companies and official PDF filings
        run: node collector/company-evidence-v5.cjs
      - name: Publish autonomous research without waiting for macro collector
        run: node collector/research-v5-publish.cjs
      - name: Publish with safe retry if another collector updated main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              node collector/company-evidence-v5.cjs
              node collector/research-v5-publish.cjs
            fi
            git add market-intelligence/company-evidence-v5.json market-intelligence/research-v5.json
            if git diff --staged --quiet; then
              echo "No verified company research changes to publish."
              exit 0
            fi
            git commit -m "Publish verified CSE company coverage"
            if git push origin HEAD:main; then
              echo "AutoPilot company research published."
              exit 0
            fi
            echo "Branch advanced while publishing; refreshing before retry $attempt"
          done
          echo "Failed to publish after three non-destructive retries" >&2
          exit 1
